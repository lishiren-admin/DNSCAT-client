name: 打包 Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 16
        uses: actions/setup-node@v4  # 这里修好了
        with:
          node-version: 16

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 打包（强制跳过token检查）
        run: |
          set GH_TOKEN=none
          npm run build:win

      - name: 保存所有安装包
        uses: actions/upload-artifact@v4  # 这里修好了
        with:
          name: my-exe
          path: build/
