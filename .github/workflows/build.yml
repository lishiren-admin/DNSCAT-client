name: 打包 Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 打包 EXE
        run: npm run build:win

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: my-exe
          path: build/*.exe
