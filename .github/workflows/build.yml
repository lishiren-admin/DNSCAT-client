name: 打包EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      # 👇 这是唯一能跑的命令！所有变量全部补齐！
      - name: 打包 64位 EXE
        run: npm run build:win
        env:
          AGENT_ARCH: amd64
          GH_TOKEN: none

      - name: 保存打包好的文件
        uses: actions/upload-artifact@v4
        with:
          name: my-exe
          path: build/
