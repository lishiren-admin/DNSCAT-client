name: 打包 Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      # ✅ 关键：加 --publish=never 绝对不上传，只打包！
      - name: 打包 EXE
        run: npm run build:win -- --publish=never

      # ✅ 上传 build 目录全部文件
      - name: 保存所有安装包
        uses: actions/upload-artifact@v4
        with:
          name: my-exe
          path: build/
