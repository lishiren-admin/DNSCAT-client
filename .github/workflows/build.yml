name: 打包EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 打包Windows EXE
        run: npm run build:win
        env:
          GH_TOKEN: "no-token"

      - name: 保存文件
        uses: actions/upload-artifact@v4
        with:
          name: my-exe
          path: build/
